[project]
name = "project-init"
version = "0.1.0"
description = "A CLI utility to simplify creating projects and syncing them with a GitHub repository"
readme = "README.md"
authors = [
    { name = "newbluecat", email = "213210421+newbluecat@users.noreply.github.com" },
]
requires-python = ">=3.14"
dependencies = ["keyring>=25.7.0"]

[project.scripts]
project-init = "project_init.main:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = ["T201", "CPY001"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
